<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>{$wa->appName()} &mdash; {$wa->accountName()}</title>

    {$wa->css()}
    <script type="text/javascript" src="{$wa_url}wa-content/js/jquery/jquery-1.8.2.min.js"></script>
    <script src="{$wa_url}wa-content/js/jquery-wa/wa.js?v={$wa->version(true)}"></script>

</head>
<body>
<div id="wa">
    {$wa->header()}
    <div id="wa-app">
        <div class="block">
            <h1>[`Страница авторизации`]</h1>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        setTimeout(function() {
            let access_pass = prompt('[`Где пароль Лебовски?`]');
            if (access_pass) {
                $.post('?module=backendAuth', { access_pass: access_pass }, function (data) {
                    if (data.status === 'ok') {
                        window.location.href = '{$wa_app_url}';
                    } else {
                        console.warn('ERROR', data);
                        if (data.errors) {
                            $('div.block').html(data.errors.join('. '));
                        }
                    }
                });
            } else {
                $('div.block').html('[`Страшные проклятия!!! Код не введен`]');
            }
        }, 200);
    });
</script>
</body>
</html>
